name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install latest npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and select npm channel
        id: release
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          ACTUAL_TAG="${GITHUB_REF_NAME}"

          if [ "${ACTUAL_TAG}" != "${EXPECTED_TAG}" ]; then
            echo "Tag ${ACTUAL_TAG} does not match package.json version ${PACKAGE_VERSION}; expected ${EXPECTED_TAG}."
            exit 1
          fi

          case "$PACKAGE_VERSION" in
            *-beta.*) DIST_TAG=beta ;;
            *-*) echo "Only beta and stable versions can be published."; exit 1 ;;
            *) DIST_TAG=latest ;;
          esac
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify package
        run: npm pack --dry-run

      - name: Publish package
        env:
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$(npm view "$NAME@$DIST_TAG" version --prefer-online 2>/dev/null)" = "$VERSION" ]; then
            echo "Package $NAME@$VERSION is already available under $DIST_TAG."
            exit 0
          fi
          npm publish --tag "$DIST_TAG"
